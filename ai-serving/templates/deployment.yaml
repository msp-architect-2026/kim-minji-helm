{{- $autoscaled := or .Values.keda.enabled .Values.hpa.enabled }}
{{- if .Values.rollout.enabled }}
# Argo Rollouts 카나리: 새 이미지를 일부 Pod에 먼저 띄우고 AnalysisTemplate(Prometheus)로 판정, 실패하면 자동 롤백
apiVersion: argoproj.io/v1alpha1
kind: Rollout
{{- else }}
apiVersion: apps/v1
kind: Deployment
{{- end }}
metadata:
  name: {{ include "common.fullname" . }}
  labels:
    {{- include "common.labels" . | nindent 4 }}
  {{- if .Values.rollout.enabled }}
  annotations:
    # Argo Rollouts CRD가 설치되기 전 첫 sync의 dry-run 실패를 건너뛴다 (retry로 수렴)
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
  {{- end }}
spec:
  {{- if not $autoscaled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  # 오토스케일링(KEDA·HPA)을 쓸 때는 replicas를 비워 둔다 (ArgoCD selfHeal이 늘어난 Pod 수를 되돌리지 않게)
  {{- if .Values.rollout.enabled }}
  # 카나리 Pod가 이 시간 안에 Ready가 안 되면(예: OOMKilled) 자동 중단·롤백한다 (분석은 setWeight 완료 후에 시작되므로)
  progressDeadlineSeconds: {{ .Values.rollout.progressDeadlineSeconds }}
  progressDeadlineAbort: true
  strategy:
    canary:
      {{- with .Values.rollout.maxSurge }}
      maxSurge: {{ . }}
      {{- end }}
      maxUnavailable: 0
      steps:
        {{- range .Values.rollout.steps }}
        {{- if hasKey . "analysis" }}
        - analysis:
            templates:
              - templateName: {{ include "common.fullname" $ }}-canary
            args:
              - name: canary-hash
                valueFrom:
                  podTemplateHashValue: Latest
        {{- else }}
        - {{ toYaml . | nindent 10 | trim }}
        {{- end }}
        {{- end }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "common.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "common.selectorLabels" . | nindent 8 }}
    spec:
      {{- if .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml .Values.nodeSelector | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml .Values.imagePullSecrets | nindent 8 }}
      {{- end }}
      {{- with .Values.dnsConfig }}
      dnsConfig:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: ai-serving
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8000
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- if .Values.env }}
          env:
            {{- range $key, $value := .Values.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
          {{- end }}
          {{- if .Values.probes.enabled }}
          readinessProbe:
            httpGet:
              path: {{ .Values.probes.readiness.path }}
              port: http
            initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.readiness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.readiness.failureThreshold }}

          livenessProbe:
            httpGet:
              path: {{ .Values.probes.liveness.path }}
              port: http
            initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.liveness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.liveness.failureThreshold }}
          {{- end }}