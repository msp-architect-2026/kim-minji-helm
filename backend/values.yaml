nameOverride: ""
fullnameOverride: ""

replicaCount: 1

image:
  repository: gitlab.local:5050/root/kim-minji-backend
  tag: "f6eb0c30"
  pullPolicy: Always

imagePullSecrets:
  - name: gitlab-registry-secret

service:
  type: ClusterIP
  port: 8080

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: 1000m
    memory: 1Gi

# 점 2개 이상인 이름(*.svc.cluster.local 등)은 search domain을 붙이지 않고 바로 조회
dnsConfig:
  options:
    - name: ndots
      value: "2"

env:
  SPRING_PROFILES_ACTIVE: "prod"
  AI_SERVER_URL: "http://kim-minji-ai-serving-ai-serving.ai-serving.svc.cluster.local:8000"

secret:
  name: backend-secret

probes:
  enabled: true
  readiness:
    path: /actuator/health
    initialDelaySeconds: 10
    periodSeconds: 10
  liveness:
    path: /actuator/health
    initialDelaySeconds: 20
    periodSeconds: 20

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 80

# 워크로드 HA. 값은 프로파일 파일에서 정한다 (dev: ScheduleAnyway·PDB 없음 / full: DoNotSchedule·PDB)
topologySpread:
  enabled: true
  whenUnsatisfiable: ScheduleAnyway
pdb:
  enabled: false
  minAvailable: 1
