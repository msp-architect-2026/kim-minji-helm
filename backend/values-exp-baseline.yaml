# 실험 A (baseline): Circuit Breaker 영향을 빼고 kube-proxy 분산만 본다 (RUNBOOK 4.15)
# Circuit Breaker 무력화: 모든 예외를 판정에서 뺀다(ignore-exceptions) → 실패가 기록되지 않아 열리지 않는다.
# 실패율 기준만 올리면(창 1000·100%) kube-proxy가 keep-alive 연결을 장애 Pod에 몰아줄 때 1000건 연속 실패로 열릴 수 있다 (실험에서 확인)
# 환경변수로 resilience4j.circuitbreaker.instances.aiServing.*를 쓰면 키가 소문자(aiserving)로 바뀌어 적용되지 않으므로 JSON으로 넣는다
env:
  SPRING_APPLICATION_JSON: '{"resilience4j":{"circuitbreaker":{"instances":{"aiServing":{"ignore-exceptions":["java.lang.Exception"]}}}}}'
