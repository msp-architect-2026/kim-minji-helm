nameOverride: ""
fullnameOverride: ""

image:
  repository: gitlab.local:5050/root/kim-minji-frontend
  tag: "861df825"
  pullPolicy: IfNotPresent

replicaCount: 1

service:
  type: ClusterIP
  port: 80

# 리소스는 PoC 기본값 (필요 시 조절)
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 300m
    memory: 256Mi

# (선택) SPA 라우팅 fallback이 필요하면 true
nginxSpaFallback:
  enabled: true
  # 필요 시 root 경로 조정 가능
  # locationRoot: /usr/share/nginx/html

# 프론트는 보통 별도 health endpoint가 없으니 Nginx 기본 체크로 처리(포트 열림 확인)
probes:
  liveness:
    enabled: true
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 2
    failureThreshold: 6
  readiness:
    enabled: true
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 2
    failureThreshold: 6


serviceAccount:
  create: false
  name: ""

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts: []
  tls: []

httpRoute:
  enabled: false
  parentRefs: []
  hostnames: []
  rules: []


autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: ""

# AI 전용 노드(k3s-ai2)에는 두지 않는다. PreferNoSchedule taint만으로는 topologySpread(DoNotSchedule)가
# ai2를 분산 대상으로 계산해 롤링 업데이트 때 그쪽으로 밀려날 수 있다. nodeAffinityPolicy(기본 Honor)로 ai2가 계산에서도 빠진다
affinity:
  nodeAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: NotIn
              values:
                - k3s-ai2

# 워크로드 HA. 값은 프로파일 파일에서 정한다 (dev: ScheduleAnyway·PDB 없음 / full: DoNotSchedule·PDB)
topologySpread:
  enabled: true
  whenUnsatisfiable: ScheduleAnyway
pdb:
  enabled: false
  minAvailable: 1
  maxUnavailable: 1  # minAvailable을 null로 둘 때만 쓴다
