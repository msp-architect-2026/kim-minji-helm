nameOverride: ""
fullnameOverride: ""

replicaCount: 1

image:
  repository: gitlab.local:5050/root/kim-minji-ai
  tag: "274b35d2"
  pullPolicy: IfNotPresent  # 태그가 커밋 SHA라 바뀌지 않으므로 매번 받지 않는다

service:
  type: ClusterIP
  port: 8000


resources:
  requests:
    cpu: 500m
    memory: 1Gi
  limits:
    cpu: 1500m
    memory: 3Gi

# 점 2개 이상인 이름(*.svc.cluster.local 등)은 search domain을 붙이지 않고 바로 조회
dnsConfig:
  options:
    - name: ndots
      value: "2"

env:
  MINIO_ENDPOINT: "http://minio-minio.storage.svc.cluster.local:9000"
  MODEL_BUCKET: "wafer-model"
  MODEL_KEY: "wafer_defect_model.h5"

secretEnv: {}

probes:
  enabled: true
  readiness:
    path: /health
    initialDelaySeconds: 60
    periodSeconds: 10
    timeoutSeconds: 10
    failureThreshold: 12
  liveness:
    path: /health
    initialDelaySeconds: 120
    periodSeconds: 30
    timeoutSeconds: 10
    failureThreshold: 6

# 오토스케일링은 KEDA(요청 수 + CPU). hpa는 KEDA를 끈 경우의 CPU 기준 HPA
keda:
  enabled: true
  minReplicas: 1
  maxReplicas: 3
  prometheusAddress: http://monitoring-kube-prometheus-prometheus.monitoring.svc:9090
  # Pod 하나가 감당할 초당 /predict 요청 수. 부하 테스트로 조정 (RUNBOOK C21)
  requestsPerSecondPerPod: 2
  cpuUtilization: 70
  pollingInterval: 15
  # 축소 안정화 시간(초). (KEDA cooldownPeriod는 0개로 줄일 때만 쓰여 여기서는 의미가 없다)
  scaleDownStabilizationSeconds: 300

hpa:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 70

# Argo Rollouts 카나리 (프로파일 공통). 레플리카 기반: setWeight는 전체 Pod 중 새 버전 비율
rollout:
  enabled: true
  # 카나리 Pod를 기존 Pod에 더해 띄운다 (가용 Pod 수가 줄지 않게)
  maxSurge: 1
  # 카나리 Pod가 이 시간 안에 Ready가 안 되면 자동 중단 (모델 로딩 60~120초 고려)
  progressDeadlineSeconds: 600
  steps:
    - setWeight: 50
    - analysis: {}
    - setWeight: 100
  analysis:
    initialDelay: 1m
    interval: 1m
    count: 3
    failureLimit: 1
    maxErrorRatio: 0.05

# 노드 배치는 프로파일별로 정한다: full은 k3s-ai2 고정(values-full.yaml), dev는 k3s-ai2 선호(values-dev.yaml)
nodeSelector: {}
affinity: {}

# k3s-ai2의 taint(dedicated=ai-serving:PreferNoSchedule, RUNBOOK 참고)를 허용한다
tolerations:
  - key: dedicated
    operator: Equal
    value: ai-serving
    effect: PreferNoSchedule

imagePullSecrets:
  - name: gitlab-registry-secret

# full: HPA로 2개 이상일 때 drain이 한 번에 모두 내리지 않게 한다 (k3s-ai2 고정이라 노드 분산은 없음)
pdb:
  enabled: false
  minAvailable: null
  maxUnavailable: 1

# 트레이싱 (OTel → Collector → Tempo). full에서만 켠다 (values-full.yaml)
tracing:
  enabled: false
  endpoint: http://otel-collector.monitoring.svc:4318
  samplerRatio: "1.0"
