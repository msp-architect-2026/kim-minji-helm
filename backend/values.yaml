nameOverride: ""
fullnameOverride: ""

replicaCount: 1

image:
  repository: gitlab.local:5050/root/kim-minji-backend
  tag: "f6eb0c30"
  pullPolicy: IfNotPresent  # 태그가 커밋 SHA라 바뀌지 않으므로 매번 받지 않는다

imagePullSecrets:
  - name: gitlab-registry-secret

service:
  type: ClusterIP
  port: 8080

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: 1000m
    memory: 1Gi

# 점 2개 이상인 이름(*.svc.cluster.local 등)은 search domain을 붙이지 않고 바로 조회
dnsConfig:
  options:
    - name: ndots
      value: "2"

env:
  SPRING_PROFILES_ACTIVE: "prod"
  AI_SERVER_URL: "http://kim-minji-ai-serving-ai-serving.ai-serving.svc.cluster.local:8000"

secret:
  name: backend-secret

probes:
  enabled: true
  readiness:
    path: /actuator/health
    initialDelaySeconds: 10
    periodSeconds: 10
  liveness:
    path: /actuator/health
    initialDelaySeconds: 20
    periodSeconds: 20

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 80

# AI 전용 노드(k3s-ai2)에는 두지 않는다. PreferNoSchedule taint만으로는 topologySpread(DoNotSchedule)가
# ai2를 분산 대상으로 계산해 롤링 업데이트 때 그쪽으로 밀려날 수 있다. nodeAffinityPolicy(기본 Honor)로 ai2가 계산에서도 빠진다
affinity:
  nodeAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: NotIn
              values:
                - k3s-ai2

# 워크로드 HA. 값은 프로파일 파일에서 정한다 (dev: ScheduleAnyway·PDB 없음 / full: DoNotSchedule·PDB)
topologySpread:
  enabled: true
  whenUnsatisfiable: ScheduleAnyway
pdb:
  enabled: false
  minAvailable: 1
  maxUnavailable: 1  # minAvailable을 null로 둘 때만 쓴다

# 트레이싱 (OTel → Collector → Tempo). full에서만 켠다 (values-full.yaml)
tracing:
  enabled: false
  endpoint: http://otel-collector.monitoring.svc:4318
  samplerRatio: "1.0"
  # OTel Java agent (initContainer가 /javaagent.jar를 복사)
  agentImage: ghcr.io/open-telemetry/opentelemetry-operator/autoinstrumentation-java:2.32.0
