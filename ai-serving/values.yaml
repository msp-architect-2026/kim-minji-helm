nameOverride: ""
fullnameOverride: ""

replicaCount: 1

image:
  repository: gitlab.local:5050/root/kim-minji-ai
  tag: "274b35d2"
  pullPolicy: IfNotPresent  # 태그가 커밋 SHA라 바뀌지 않으므로 매번 받지 않는다

service:
  type: ClusterIP
  port: 8000


resources:
  requests:
    cpu: 500m
    memory: 1Gi
  limits:
    cpu: 1500m
    memory: 3Gi

# 점 2개 이상인 이름(*.svc.cluster.local 등)은 search domain을 붙이지 않고 바로 조회
dnsConfig:
  options:
    - name: ndots
      value: "2"

env:
  MINIO_ENDPOINT: "http://minio-minio.storage.svc.cluster.local:9000"
  MODEL_BUCKET: "wafer-model"
  MODEL_KEY: "wafer_defect_model.h5"
  # 장애 주입 API(/admin/fault). 실험 오버레이(values-exp-*.yaml)에서만 켠다 (RUNBOOK 4.15)
  FAULT_INJECTION_ENABLED: "false"

secretEnv: {}

probes:
  enabled: true
  readiness:
    path: /health
    initialDelaySeconds: 60
    periodSeconds: 10
    timeoutSeconds: 10
    failureThreshold: 12
  liveness:
    path: /health
    initialDelaySeconds: 120
    periodSeconds: 30
    timeoutSeconds: 10
    failureThreshold: 6

# 오토스케일링은 KEDA(요청 수 + CPU). hpa는 KEDA를 끈 경우의 CPU 기준 HPA
keda:
  enabled: true
  minReplicas: 1
  maxReplicas: 3
  prometheusAddress: http://monitoring-kube-prometheus-prometheus.monitoring.svc:9090
  # Pod 하나가 감당할 초당 /predict 요청 수. 부하 테스트로 조정 (RUNBOOK C21)
  requestsPerSecondPerPod: 2
  cpuUtilization: 70
  pollingInterval: 15
  # 축소 안정화 시간(초). (KEDA cooldownPeriod는 0개로 줄일 때만 쓰여 여기서는 의미가 없다)
  scaleDownStabilizationSeconds: 300

hpa:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 70

# Argo Rollouts 카나리 (프로파일 공통). 레플리카 기반: setWeight는 전체 Pod 중 새 버전 비율
rollout:
  enabled: true
  # 카나리 Pod를 기존 Pod에 더해 띄운다 (가용 Pod 수가 줄지 않게)
  maxSurge: 1
  # 카나리 Pod가 이 시간 안에 Ready가 안 되면 자동 중단 (모델 로딩 60~120초 고려)
  progressDeadlineSeconds: 600
  steps:
    - setWeight: 50
    - analysis: {}
    - setWeight: 100
  analysis:
    initialDelay: 1m
    interval: 1m
    count: 3
    failureLimit: 1
    maxErrorRatio: 0.05

# 노드 배치는 프로파일별로 정한다: full은 k3s-ai2 고정(values-full.yaml), dev는 k3s-ai2 선호(values-dev.yaml)
nodeSelector: {}
affinity: {}

# k3s-ai2의 taint(dedicated=ai-serving:PreferNoSchedule, RUNBOOK 참고)를 허용한다
tolerations:
  - key: dedicated
    operator: Equal
    value: ai-serving
    effect: PreferNoSchedule

imagePullSecrets:
  - name: gitlab-registry-secret

# full: HPA로 2개 이상일 때 drain이 한 번에 모두 내리지 않게 한다 (k3s-ai2 고정이라 노드 분산은 없음)
pdb:
  enabled: false
  minAvailable: null
  maxUnavailable: 1

# 트레이싱 (OTel → Collector → Tempo). full에서만 켠다 (values-full.yaml)
tracing:
  enabled: false
  endpoint: http://otel-collector.monitoring.svc:4318
  samplerRatio: "1.0"

# Istio 서비스 메시: Pod 단위 장애 격리(Outlier Detection) 실험용 (RUNBOOK 4.15). 실험 오버레이(values-exp-mesh*.yaml)에서만 켠다.
# 켜면 Pod에 sidecar 주입 라벨을 붙이고 DestinationRule·VirtualService를 만든다. istiod는 kim-minji-infra istio 차트.
# 격리 판단은 호출하는 쪽(backend Pod마다 붙은 sidecar)이 각자 한다
mesh:
  enabled: false
  outlierDetection:
    # 연속 5xx 횟수. 도달하는 즉시 그 Pod를 격리한다 (interval을 기다리지 않음)
    consecutive5xxErrors: 3
    # 격리 해제·비율 기반 판정 주기
    interval: 5s
    # 격리 시간 = baseEjectionTime × 격리된 횟수 (다시 넣었다가 또 실패하면 30초 → 60초 → 90초 ...)
    baseEjectionTime: 30s
    maxEjectionPercent: 50
    # 0: 패닉 모드(정상 Pod 비율이 기준보다 낮으면 격리를 무시하고 전체에 분산)를 끈다
    minHealthPercent: 0
    # false: sidecar의 timeout(504 UT)·연결 reset도 연속 5xx로 센다. true로 두면 "느리게 실패하는 Pod"에 요청이 쌓여
    # timeout만 나는 동안 다시 격리되지 않는다 (RUNBOOK 4.15 지연 실험: 3회 중 1회 p95 5s·실패 23%, false로는 3회 모두 격리).
    # 대신 과부하로 느려진 정상 Pod도 격리될 수 있다 — maxEjectionPercent 50이라 2개 중 1개까지만 빠진다
    splitExternalLocalOriginErrors: false
  # 호출하는 sidecar 하나가 ai-serving 전체(Pod 합계)로 여는 연결·대기 요청 상한. 넘으면 sidecar가 바로 503(UO)을 반환한다.
  # 단일 워커 FastAPI라 Pod당 동시 처리량이 작다. 부하 테스트로 조정 (RUNBOOK C25)
  connectionPool:
    tcp:
      maxConnections: 32
      connectTimeout: 2s
    http:
      http1MaxPendingRequests: 32
      maxRequestsPerConnection: 0
  # 요청 하나의 전체 응답 대기 상한 (AI p95 SLO 3초 + 여유)
  timeout: 5s
  retries:
    # 0: 재시도 없음. retries를 생략하면 Istio 기본 정책(2회, 503 등)이 적용돼 Outlier Detection 효과와 섞이므로 명시한다
    attempts: 0
    # timeout과 같게 둔다. 더 짧으면 느린 정상 응답이 잘려 재시도되고(실험 D), 그 504가 정상 Pod 오류로 잡힌다
    perTryTimeout: 5s
    # 503(장애 Pod 응답)과 연결 실패만 재시도한다. 5xx·gateway-error를 넣으면 timeout까지 재시도 대상이 된다
    retryOn: 503,connect-failure
