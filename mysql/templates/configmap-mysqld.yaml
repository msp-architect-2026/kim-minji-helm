# mysqld 설정. /etc/mysql/conf.d/wafer.cnf로 마운트한다.
# clone plugin: full에서 replica가 primary 데이터를 통째로 복사해 초기 동기화한다 (binlog 이전 데이터 포함)
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "common.fullname" . }}-mysqld
  labels:
    {{- include "common.labels" . | nindent 4 }}
data:
  primary.cnf: |
    [mysqld]
    server-id = 1
    log-bin = mysql-bin
    binlog_format = ROW
    gtid_mode = ON
    enforce_gtid_consistency = ON
    binlog_expire_logs_seconds = {{ .Values.mysqld.binlogExpireSeconds }}
    plugin-load-add = mysql_clone.so
  replica.cnf: |
    [mysqld]
    server-id = 2
    log-bin = mysql-bin
    relay-log = relay-bin
    binlog_format = ROW
    gtid_mode = ON
    enforce_gtid_consistency = ON
    binlog_expire_logs_seconds = {{ .Values.mysqld.binlogExpireSeconds }}
    plugin-load-add = mysql_clone.so
    # 복제 설정 전에 replica가 혼자 쓰기를 받지 않도록 (설정 Job이 SET PERSIST super_read_only=ON 으로 고정)
    read_only = ON
