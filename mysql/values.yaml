nameOverride: ""
fullnameOverride: ""

image:
  repository: mysql
  tag: "8.0"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 3306
  # headless를 쓸지 여부(기본 false)
  headless: false

persistence:
  enabled: true
  storageClassName: ""
  accessModes: ["ReadWriteOnce"]
  size: 10Gi

resources:
  requests:
    cpu: 200m
    memory: 512Mi
  limits:
    cpu: 1000m
    memory: 1Gi

# 민감정보는 SealedSecret으로 관리 (평문 커밋 금지)
secret:
  name: mysql-secret
  keys:
    rootPassword: MYSQL_ROOT_PASSWORD
    database: MYSQL_DATABASE
    username: MYSQL_USER
    password: MYSQL_PASSWORD

# kubeseal로 암호화한 값. 키 이름은 secret.keys와 같아야 한다.
# 생성 방법: README "mysql SealedSecret 생성" 참고
sealedSecret:
  encryptedData: {}
    # MYSQL_ROOT_PASSWORD: AgB...
    # MYSQL_DATABASE: AgB...
    # MYSQL_USER: AgB...
    # MYSQL_PASSWORD: AgB...

config:
  name: mysql-config
  keys:
    host: MYSQL_HOST
    port: MYSQL_PORT

# probe
probes:
  enabled: true
  readiness:
    initialDelaySeconds: 10
    periodSeconds: 10
  liveness:
    initialDelaySeconds: 30
    periodSeconds: 20


initSchema:
  enabled: false

# 노드 고정 없음. local-path PV는 PV의 nodeAffinity가 배치 노드를 정한다 (Longhorn 전환 후에는 어느 노드든 가능)
nodeSelector: {}  