nameOverride: ""
fullnameOverride: ""

replicaCount: 1

image:
  repository: gitlab.local:5050/root/kim-minji-ai
  tag: "274b35d2"
  pullPolicy: Always

service:
  type: ClusterIP
  port: 8000


resources:
  requests:
    cpu: 500m
    memory: 1Gi
  limits:
    cpu: 1500m
    memory: 3Gi

# 점 2개 이상인 이름(*.svc.cluster.local 등)은 search domain을 붙이지 않고 바로 조회
dnsConfig:
  options:
    - name: ndots
      value: "2"

env:
  MINIO_ENDPOINT: "http://minio-minio.storage.svc.cluster.local:9000"
  MODEL_BUCKET: "wafer-model"
  MODEL_KEY: "wafer_defect_model.h5"

secretEnv: {}

probes:
  enabled: true
  readiness:
    path: /health
    initialDelaySeconds: 60
    periodSeconds: 10
    timeoutSeconds: 10
    failureThreshold: 12
  liveness:
    path: /health
    initialDelaySeconds: 120
    periodSeconds: 30
    timeoutSeconds: 10
    failureThreshold: 6

hpa:
  enabled: true
  minReplicas: 1
  maxReplicas: 4
  targetCPUUtilizationPercentage: 70

# 노드 배치는 프로파일별로 정한다: full은 k3s-ai2 고정(values-full.yaml), dev는 k3s-ai2 선호(values-dev.yaml)
nodeSelector: {}
affinity: {}

# k3s-ai2의 taint(dedicated=ai-serving:PreferNoSchedule, RUNBOOK 참고)를 허용한다
tolerations:
  - key: dedicated
    operator: Equal
    value: ai-serving
    effect: PreferNoSchedule

imagePullSecrets:
  - name: gitlab-registry-secret

# full: HPA로 2개 이상일 때 drain이 한 번에 모두 내리지 않게 한다 (k3s-ai2 고정이라 노드 분산은 없음)
pdb:
  enabled: false
  minAvailable: null
  maxUnavailable: 1
