{{- $enc := .Values.sealedSecret.encryptedData -}}
{{- range $k := list .Values.auth.existingSecret.accessKeyKey .Values.auth.existingSecret.secretKeyKey }}
{{- if not (get $enc $k) }}
{{- fail (printf "sealedSecret.encryptedData.%s is required (kubeseal로 암호화한 값)" $k) }}
{{- end }}
{{- end }}
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: {{ .Values.auth.existingSecret.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "common.labels" . | nindent 4 }}
spec:
  encryptedData:
    {{- toYaml $enc | nindent 4 }}
  template:
    metadata:
      name: {{ .Values.auth.existingSecret.name }}
      namespace: {{ .Release.Namespace }}
      labels:
        {{- include "common.labels" . | nindent 8 }}
    type: Opaque
