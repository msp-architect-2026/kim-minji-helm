{{- if .Values.rollout.enabled }}
# 카나리 판정: 분석 동안 /predict 5xx 비율이 기준 미만이고 서비스가 수집되고 있으면 성공.
# 트래픽이 없을 때는 비율을 0으로 본다 (분석이 NaN으로 실패하지 않게)
{{- $job := include "common.fullname" . }}
apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: {{ include "common.fullname" . }}-canary
  labels:
    {{- include "common.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  metrics:
    - name: predict-error-ratio
      interval: {{ .Values.rollout.analysis.interval }}
      count: {{ .Values.rollout.analysis.count }}
      failureLimit: {{ .Values.rollout.analysis.failureLimit }}
      successCondition: result[0] < {{ .Values.rollout.analysis.maxErrorRatio }}
      provider:
        prometheus:
          address: {{ .Values.keda.prometheusAddress }}
          query: |
            (
              sum(rate(http_requests_total{job="{{ $job }}",handler="/predict",status="5xx"}[2m]))
                / (sum(rate(http_requests_total{job="{{ $job }}",handler="/predict"}[2m])) > 0)
            ) or vector(0)
    - name: targets-up
      interval: {{ .Values.rollout.analysis.interval }}
      count: {{ .Values.rollout.analysis.count }}
      failureLimit: {{ .Values.rollout.analysis.failureLimit }}
      # 카나리 Pod를 포함해 수집 대상이 하나라도 살아 있어야 한다
      successCondition: result[0] >= 1
      provider:
        prometheus:
          address: {{ .Values.keda.prometheusAddress }}
          query: sum(up{job="{{ $job }}"}) or vector(0)
{{- end }}
