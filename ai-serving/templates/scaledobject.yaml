{{- if .Values.keda.enabled }}
# KEDA: /predict 요청 수(Prometheus)와 CPU 중 더 큰 쪽 기준으로 Pod 수를 정한다. KEDA가 HPA를 대신 만든다
{{- $job := include "common.fullname" . }}
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: {{ include "common.fullname" . }}
  labels:
    {{- include "common.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  scaleTargetRef:
    {{- if .Values.rollout.enabled }}
    apiVersion: argoproj.io/v1alpha1
    kind: Rollout
    {{- else }}
    apiVersion: apps/v1
    kind: Deployment
    {{- end }}
    name: {{ include "common.fullname" . }}
  minReplicaCount: {{ .Values.keda.minReplicas }}
  maxReplicaCount: {{ .Values.keda.maxReplicas }}
  pollingInterval: {{ .Values.keda.pollingInterval }}
  advanced:
    horizontalPodAutoscalerConfig:
      behavior:
        scaleDown:
          # 축소는 이 시간 동안 낮은 부하가 이어질 때만 (모델 로딩이 60초 이상이라 잦은 증감을 피한다)
          stabilizationWindowSeconds: {{ .Values.keda.scaleDownStabilizationSeconds }}
  triggers:
    # Pod당 초당 /predict 요청 수가 기준을 넘으면 늘린다 (추론 지연이 CPU보다 먼저 반응)
    - type: prometheus
      metadata:
        serverAddress: {{ .Values.keda.prometheusAddress }}
        query: sum(rate(http_requests_total{job="{{ $job }}",handler="/predict"}[2m]))
        threshold: {{ .Values.keda.requestsPerSecondPerPod | quote }}
        # 결과가 비면(시계열 없음) 0으로 본다. Prometheus 자체가 장애면 이 트리거가 오류가 되어
        # CPU 기준 확장만 되고 축소는 멈춘다 (RUNBOOK 4.13)
        ignoreNullValues: "true"
    - type: cpu
      metricType: Utilization
      metadata:
        value: {{ .Values.keda.cpuUtilization | quote }}
{{- end }}
