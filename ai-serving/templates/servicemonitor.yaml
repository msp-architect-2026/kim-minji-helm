apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: ai-serving-servicemonitor
  namespace: monitoring
  labels:
    release: monitoring
spec:
  # Argo Rollouts가 붙이는 Pod 해시를 메트릭 레이블(rollouts_pod_template_hash)로 남겨 카나리 Pod만 따로 분석한다
  podTargetLabels:
    - rollouts-pod-template-hash
  selector:
    matchLabels:
      app.kubernetes.io/name: ai-serving
  namespaceSelector:
    matchNames:
      - ai-serving
  endpoints:
    - port: http
      path: /metrics
      interval: 30s