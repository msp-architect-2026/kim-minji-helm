{{- $enc := .Values.sealedSecret.encryptedData -}}
{{- $required := list .Values.secret.keys.rootPassword .Values.secret.keys.database .Values.secret.keys.username .Values.secret.keys.password }}
{{- if .Values.replication.enabled }}
{{- $required = append $required .Values.secret.keys.replicationPassword }}
{{- end }}
{{- range $k := $required }}
{{- if not (get $enc $k) }}
{{- fail (printf "sealedSecret.encryptedData.%s is required (kubeseal로 암호화한 값)" $k) }}
{{- end }}
{{- end }}
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: {{ .Values.secret.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "common.labels" . | nindent 4 }}
spec:
  encryptedData:
    {{- toYaml $enc | nindent 4 }}
  template:
    metadata:
      name: {{ .Values.secret.name }}
      namespace: {{ .Release.Namespace }}
      labels:
        {{- include "common.labels" . | nindent 8 }}
    type: Opaque
