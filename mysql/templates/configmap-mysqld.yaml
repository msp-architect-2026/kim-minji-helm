# mysqld 설정. /etc/mysql/conf.d/wafer.cnf로 마운트한다.
# clone plugin: full에서 replica가 primary 데이터를 통째로 복사해 초기 동기화한다 (binlog 이전 데이터 포함)
# binlog는 MySQL 8.0 기본값(ON, 파일명 binlog.*)을 그대로 쓴다
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "common.fullname" . }}-mysqld
  labels:
    {{- include "common.labels" . | nindent 4 }}
data:
  primary.cnf: |
    {{- include "mysql.primaryCnf" . | nindent 4 }}
  replica.cnf: |
    {{- include "mysql.replicaCnf" . | nindent 4 }}
