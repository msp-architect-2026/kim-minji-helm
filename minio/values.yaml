nameOverride: ""
fullnameOverride: ""

image:
  repository: minio/minio
  tag: "RELEASE.2024-01-16T16-07-38Z"
  pullPolicy: IfNotPresent

replicaCount: 1

service:
  type: ClusterIP
  apiPort: 9000
  consolePort: 9001
  exposeConsole: true

mode:
  dataDir: /data

persistence:
  enabled: true
  # Longhorn: 노드가 꺼져도 다른 노드에서 볼륨을 붙일 수 있다 (local-path → Longhorn 이전 절차는 infra RUNBOOK)
  storageClassName: longhorn
  accessModes: ["ReadWriteOnce"]
  size: 10Gi

resources:
  requests:
    cpu: 200m
    memory: 256Mi
  limits:
    cpu: 600m
    memory: 512Mi

# 루트 계정은 SealedSecret(minio-secret)으로 관리 (평문 커밋 금지)
auth:
  existingSecret:
    name: minio-secret
    accessKeyKey: accessKey
    secretKeyKey: secretKey

# kubeseal로 암호화한 값. 키 이름은 auth.existingSecret의 키와 같아야 한다.
# 생성 방법: README "minio SealedSecret 생성" 참고
sealedSecret:
  encryptedData: {}
    # accessKey: AgB...
    # secretKey: AgB...

probes:
  liveness:
    enabled: true
    path: /minio/health/live
    initialDelaySeconds: 30
    periodSeconds: 20
    timeoutSeconds: 10
    failureThreshold: 6
  readiness:
    enabled: true
    path: /minio/health/ready
    initialDelaySeconds: 20
    periodSeconds: 20
    timeoutSeconds: 10
    failureThreshold: 6

# 노드 고정 없음. local-path PV는 PV의 nodeAffinity가 배치 노드를 정한다 (Longhorn 전환 후에는 어느 노드든 가능)
nodeSelector: {}