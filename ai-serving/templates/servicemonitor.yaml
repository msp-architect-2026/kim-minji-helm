apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: ai-serving-servicemonitor
  namespace: monitoring
  labels:
    release: monitoring
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: ai-serving
  namespaceSelector:
    matchNames:
      - ai-serving
  endpoints:
    - port: http
      path: /metrics
      interval: 30s