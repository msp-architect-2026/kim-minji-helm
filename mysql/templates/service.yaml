apiVersion: v1
kind: Service
metadata:
  name: {{ include "common.fullname" . }}
  labels:
    {{- include "common.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: mysql
      protocol: TCP
      name: mysql
  selector:
    {{- if .Values.failover.promoted }}
    # 수동 failover(infra RUNBOOK 4.9): backend가 쓰는 Service를 승격된 replica로 돌린다
    {{- include "mysql.replicaSelectorLabels" . | nindent 4 }}
    {{- else }}
    {{- include "common.selectorLabels" . | nindent 4 }}
    {{- end }}